<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9B8D5" />
      <stop offset="100%" stop-color="#F6A4CB" />
    </linearGradient>
  </defs>
  <!-- Rounded Square Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <!-- Subtle Contrast Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />
  <!-- Bold, High-Contrast Initials: MD -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="-1.2px"
    fill="#111827"
  >MD</text>
</svg>
